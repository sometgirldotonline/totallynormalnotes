<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
    <div class="splash" style="opacity:0;">
        <h1>Loading...</h1>
        <progress>
    </div>
    <div class="app" style="opacity: 0">
        <section class="noteslist">
            <select name="notes" id="notes" size=6 onclick="shownote(Number(document.querySelector('#notes option:checked').value))">
              <option disabled>Notes</option>
            </select>
            <button onclick="addnote()"><i class="fa-solid fa-plus"></i> Add Note</button>
        </section>
        <section class="writer"><input id="note-title" type=text>
            <div class="split-editor">
            <div id="note-md">
            </div>
            <textarea id="note-plaintext" readonly>Select a note to start</textarea></div></section>
    </div>
    <script src="script-app.js"></script>
</body>
</html>
